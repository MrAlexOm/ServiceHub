<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceHub Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=229e8f09-7ae4-460f-93ae-ede1f5dabd54" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFFFFF 50%, #FFFFFF 100%);
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Header - All vw units */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5vw;
            padding-top: 4vw;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 0.5vw 2.5vw rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 7vw;
            font-weight: 700;
            color: #1E3A8A;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 3vw;
        }

        .notification-bell {
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .notification-bell:hover {
            transform: scale(1.1);
        }

        .notification-bell i {
            font-size: 6vw;
            color: #6B7280;
        }

        .notification-badge {
            position: absolute;
            top: -1.5vw;
            right: -1.5vw;
            background: #EF4444;
            color: white;
            width: 3.5vw;
            height: 3.5vw;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2vw;
            font-weight: 600;
            border: 0.4vw solid white;
        }

        .avatar {
            width: 11vw;
            height: 11vw;
            border-radius: 50%;
            background: linear-gradient(135deg, #E5E7EB 0%, #9CA3AF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar i {
            color: #9CA3AF;
            font-size: 3.85vw;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2vw;
            padding-bottom: 120px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Grid Layout with 12-Cell Structure (3x4) */
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 3vw;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Tile styles - No hover for main tiles */
        .tile {
            background: white;
            border-radius: 2vw;
            box-shadow: 0 1.5vw 3vw rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover only for small tiles (finance, docs, inventory) */
        .tile-finance:hover,
        .tile-docs:hover,
        .tile-inventory:hover {
            transform: translateY(-1vw);
            box-shadow: 0 2vw 4vw rgba(0, 0, 0, 0.2);
        }

        .tile-finance:active,
        .tile-docs:active,
        .tile-inventory:active {
            transform: translateY(-0.5vw);
            box-shadow: 0 1vw 2.5vw rgba(0, 0, 0, 0.15);
        }

        /* Fixed: Заявки занимает 2 квадратика в ширину */

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .tile-map img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 12-Cell Grid Positioning - No hover for main tiles */
        .tile-masters {
            grid-column: 1;
            grid-row: 1 / 2.2;
            aspect-ratio: 1;
        }

        .tile-map {
            grid-column: 2 / 4;
            grid-row: 1 / 2.2;
            aspect-ratio: 2/1;
            padding: 0;
        }

        .tile-orders {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            aspect-ratio: 2/1;
        }

        .tile-calendar {
            grid-column: 3;
            grid-row: 2.2 / 3.2;
            aspect-ratio: 1;
            padding: 2.5vw;
        }

        .tile-finance {
            grid-column: 1;
            grid-row: 3.2 / 4.2;
            aspect-ratio: 1;
            padding: 2.5vw;
        }

        .tile-docs {
            grid-column: 2;
            grid-row: 3.2 / 4.2;
            aspect-ratio: 1;
            padding: 2.5vw;
        }

        .tile-inventory {
            grid-column: 3;
            grid-row: 3.2 / 4.2;
            aspect-ratio: 1;
            padding: 2.5vw;
        }

        .tile-new-order {
            grid-column: 1 / 4;
            grid-row: 4.2 / 5;
            aspect-ratio: 3/1;
        }

        /* Orders Button - All vw units */
        .orders-button {
            background: white;
            border-radius: 2vw;
            box-shadow: 0 1.5vw 3vw rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 2vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .orders-button:hover {
            transform: translateY(-1vw);
            box-shadow: 0 2vw 4vw rgba(0, 0, 0, 0.2);
        }

        .orders-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1.5vw;
            gap: 2vw;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 6vw;
            font-weight: 900;
            margin-bottom: 1vw;
        }

        .stat-today {
            color: #10B981;
        }

        .stat-tomorrow {
            color: #F59E0B;
        }

        .stat-label {
            font-size: 3.5vw;
            color: #6B7280;
            font-weight: 600;
        }

        .orders-text {
            text-align: center;
            color: #000000;
            font-size: 4.5vw;
            font-weight: 800;
            line-height: 1.3;
        }

        /* Bottom Navigation - All vw units */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -0.5vw 2.5vw rgba(0, 0, 0, 0.1);
            padding: 3vw 0;
            z-index: 1000;
        }

        .nav-items {
            display: flex;
            justify-content: space-around;
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vw;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 1vw;
            border-radius: 1.5vw;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .nav-item.active {
            color: #3B82F6;
        }

        .nav-icon {
            font-size: 6.5vw;
        }

        .nav-label {
            font-size: 3.8vw;
            font-weight: 600;
        }

        /* Map Modal Styles */
        .map-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }

        .map-modal.active {
            display: block;
        }

        .map-modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .map-close-btn {
            position: absolute;
            bottom: 40px;
            right: 20px;
            background: rgba(30, 58, 138, 0.9);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 5vw;
            font-weight: 600;
            color: white;
            cursor: pointer;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .map-close-btn:hover {
            background: rgba(30, 58, 138, 1);
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
        }

        .map-container {
            width: 100%;
            height: 100%;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        /* Admin Profile Modals Styles */
        .admin-main-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #87CEEB 0%, #FFFFFF 50%, #FFFFFF 100%);
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .admin-main-modal.active {
            display: block;
        }

        .admin-main-content {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 4vw;
        }

        .admin-close-btn {
            position: absolute;
            top: 4vw;
            right: 4vw;
            background: white;
            border: none;
            border-radius: 2vw;
            padding: 2vw 3vw;
            font-size: 4vw;
            font-weight: 600;
            color: #1E3A8A;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 1vw;
            box-shadow: 0 1.5vw 3vw rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .admin-close-btn:hover {
            background: #F3F4F6;
            transform: scale(1.05);
        }

        .admin-main-title {
            font-size: 7vw;
            font-weight: 700;
            color: #1E3A8A;
            text-align: center;
            margin-top: 8vw;
        }

        .profile-edit-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 3vw;
            box-shadow: 0 3vw 6vw rgba(0, 0, 0, 0.2);
            z-index: 1100;
            animation: scaleIn 0.3s ease-out;
        }

        .profile-edit-modal.active {
            display: block;
        }

        .profile-edit-content {
            padding: 4vw;
        }

        .profile-edit-title {
            font-size: 5vw;
            font-weight: 700;
            color: #1E3A8A;
            text-align: center;
            margin-bottom: 4vw;
        }

        .profile-avatar-section {
            text-align: center;
            margin-bottom: 4vw;
        }

        .avatar-upload-label {
            cursor: pointer;
            display: inline-block;
        }

        .profile-avatar-preview {
            width: 20vw;
            height: 20vw;
            max-width: 120px;
            max-height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #E5E7EB 0%, #9CA3AF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2vw;
            border: 0.5vw solid white;
            box-shadow: 0 1.5vw 3vw rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .profile-avatar-preview i {
            font-size: 6vw;
            color: #9CA3AF;
        }

        .profile-avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-upload-text {
            font-size: 2.5vw;
            color: #6B7280;
            display: block;
        }

        .profile-form {
            margin-bottom: 4vw;
        }

        .form-group {
            margin-bottom: 3vw;
        }

        .form-group label {
            display: block;
            font-size: 3vw;
            font-weight: 600;
            color: #374151;
            margin-bottom: 1vw;
        }

        .form-input {
            width: 100%;
            padding: 2.5vw;
            font-size: 3vw;
            border: 0.3vw solid #E5E7EB;
            border-radius: 1.5vw;
            background: #F9FAFB;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #3B82F6;
            background: white;
            box-shadow: 0 0 0 0.3vw rgba(59, 130, 246, 0.1);
        }

        .profile-buttons {
            display: flex;
            gap: 2vw;
            justify-content: center;
        }

        .btn-secondary, .btn-primary {
            padding: 2.5vw 4vw;
            font-size: 3.5vw;
            font-weight: 600;
            border: none;
            border-radius: 1.5vw;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #6B7280;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
        }

        .btn-primary {
            background: #3B82F6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563EB;
            transform: translateY(-0.5vw);
            box-shadow: 0 1.5vw 3vw rgba(59, 130, 246, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* Responsive Media Queries */
        @media (max-width: 480px) {
            .header {
                padding: 2vw;
                padding-top: 4vw;
                padding-bottom: 4vw;
            }

            .header-title {
                font-size: 8.5vw;
                font-weight: 900;
            }

            .tiles-grid {
                gap: 3vw;
            }

            .main-content {
                padding: 1.5vw;
                padding-bottom: 100px;
            }

            .stat-number {
                font-size: 6vw;
                font-weight: 900;
            }

            .stat-label {
                font-size: 3.5vw;
                font-weight: 600;
            }

            .orders-text {
                font-size: 5vw;
                font-weight: 900;
                color: #000000;
            }

            .notification-bell i {
                font-size: 8vw;
            }

            .notification-badge {
                width: 4vw;
                height: 4vw;
                font-size: 2.5vw;
                top: -1.5vw;
                right: -1.5vw;
            }

            .avatar {
                width: 13vw;
                height: 13vw;
            }

            .avatar i {
                font-size: 4vw;
            }

            .nav-icon {
                font-size: 7.5vw;
            }

            .nav-label {
                font-size: 3.8vw;
                font-weight: 600;
            }

            .tile-calendar {
                padding: 3vw;
            }

            .tile-finance {
                padding: 3vw;
            }

            .tile-docs {
                padding: 3vw;
            }

            .tile-inventory {
                padding: 3vw;
            }

            .tile-map {
                padding: 0;
            }

            .tile-map img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .map-close-btn {
                font-size: 5vw;
                padding: 3vw 4vw;
                top: 3vw;
                right: 3vw;
            }

            .profile-edit-modal {
                width: 95%;
            }

            .profile-edit-content {
                padding: 5vw;
            }

            .profile-edit-title {
                font-size: 6vw;
            }

            .profile-avatar-preview {
                width: 25vw;
                height: 25vw;
            }

            .profile-avatar-preview i {
                font-size: 8vw;
            }

            .avatar-upload-text {
                font-size: 3vw;
            }

            .form-group label {
                font-size: 3.5vw;
            }

            .form-input {
                padding: 3vw;
                font-size: 3.5vw;
            }

            .btn-secondary, .btn-primary {
                padding: 3vw 5vw;
                font-size: 4vw;
            }

            .admin-close-btn {
                font-size: 5vw;
                padding: 3vw 4vw;
            }

            .admin-main-title {
                font-size: 8vw;
            }

            .map-close-btn {
                bottom: 30px;
                right: 15px;
                width: 50px;
                height: 50px;
                font-size: 6vw;
            }
        }

        @media (max-width: 375px) {
            .header-title {
                font-size: 4vw;
            }

            .stat-number {
                font-size: 3vw;
            }

            .nav-icon {
                font-size: 3vw;
            }

            .nav-label {
                font-size: 1.8vw;
            }
        }
    </style>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-title">ServiceHub</div>
        <div class="header-right">
            <div class="notification-bell" onclick="handleNotifications()">
                <i class="fas fa-bell"></i>
                <div class="notification-badge">3</div>
            </div>
            <div class="avatar" onclick="handleAvatarClick()">
                <i class="fas fa-user"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Tiles Grid - 3x4 Structure -->
        <div class="tiles-grid">
            <!-- Row 1: Masters (1,1) + Map (2-4,1) -->
            <div class="tile tile-masters" onclick="handleTileClick('masters')">
                <img src="masters_btn.png" alt="Мастера">
            </div>
            <div class="tile tile-map" onclick="handleTileClick('map')">
                <img src="map_btn.png" alt="Карта">
            </div>
            
            <!-- Row 2: Orders (1-3,2) + Calendar (3,2) -->
            <div class="orders-button tile-orders" onclick="handleOrdersClick()">
                <div class="orders-stats">
                    <div class="stat-item">
                        <div class="stat-number stat-today">12</div>
                        <div class="stat-label">Сегодня</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number stat-tomorrow">5</div>
                        <div class="stat-label">Завтра</div>
                    </div>
                </div>
                <div class="orders-text">
                    Заявки
                </div>
            </div>
            <div class="tile tile-calendar" onclick="handleTileClick('calendar')">
                <img src="calendar_btn.png" alt="Календарь">
            </div>
            
            <!-- Row 3: Finance (1,3) + Docs (2,3) + Inventory (3,3) -->
            <div class="tile tile-finance" onclick="handleTileClick('finance')">
                <img src="finance_btn.png" alt="Финансы">
            </div>
            <div class="tile tile-docs" onclick="handleTileClick('docs')">
                <img src="docs_btn.png" alt="Документация">
            </div>
            <div class="tile tile-inventory" onclick="handleTileClick('inventory')">
                <img src="inventory_btn.png" alt="Инвентарь">
            </div>
            
            <!-- Row 4: New Order (1-4,4) -->
            <div class="tile tile-new-order" onclick="handleTileClick('new_order')">
                <img src="new_order_btn.png" alt="Новый заказ">
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-items">
            <div class="nav-item active" onclick="handleNavClick('home')">
                <i class="fas fa-home nav-icon"></i>
                <span class="nav-label">Домой</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('calendar')">
                <i class="fas fa-calendar nav-icon"></i>
                <span class="nav-label">Календарь</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('inventory')">
                <i class="fas fa-box nav-icon"></i>
                <span class="nav-label">Инвентарь</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('docs')">
                <i class="fas fa-file-alt nav-icon"></i>
                <span class="nav-label">Документы</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('menu')">
                <i class="fas fa-bars nav-icon"></i>
                <span class="nav-label">Меню</span>
            </div>
        </div>
    </nav>

    <!-- Map Modal Window -->
    <div id="mapModal" class="map-modal">
        <div class="map-modal-content">
            <button class="map-close-btn" onclick="closeMapModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="map" class="map-container"></div>
        </div>
    </div>

    <!-- Admin Profile Modals -->
    <!-- Main Admin Cabinet (Fullscreen) -->
    <div id="adminMainModal" class="admin-main-modal">
        <div class="admin-main-content">
            <button class="admin-close-btn" onclick="closeAdminMainModal()">
                <i class="fas fa-times"></i>
                Закрыть
            </button>
            <h2 class="admin-main-title">Кабинет Менеджера</h2>
            <div class="admin-main-body">
                <!-- Content will be added in next step -->
            </div>
        </div>
    </div>

    <!-- Profile Edit Modal (Center) -->
    <div id="profileEditModal" class="profile-edit-modal">
        <div class="profile-edit-content">
            <h2 class="profile-edit-title">Заполнить профиль</h2>
            
            <div class="profile-avatar-section">
                <label for="avatarInput" class="avatar-upload-label">
                    <div class="profile-avatar-preview" id="avatarPreview">
                        <i class="fas fa-camera"></i>
                    </div>
                    <span class="avatar-upload-text">Нажмите для загрузки фото</span>
                </label>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
            </div>

            <div class="profile-form">
                <div class="form-group">
                    <label for="adminName">Имя</label>
                    <input type="text" id="adminName" placeholder="Введите имя" class="form-input">
                </div>
                
                <div class="form-group">
                    <label for="adminContact">Контакт</label>
                    <input type="text" id="adminContact" placeholder="Телефон или Email" class="form-input">
                </div>
                
                <div class="form-group">
                    <label for="adminPosition">Должность</label>
                    <input type="text" id="adminPosition" placeholder="Введите должность" class="form-input">
                </div>
            </div>

            <div class="profile-buttons">
                <button class="btn-secondary" onclick="handleEditProfile()">Редактировать</button>
                <button class="btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // Navigation handlers
        function handleTileClick(tile) {
            console.log('Tile clicked:', tile);
            switch(tile) {
                case 'masters':
                    alert('Переход на страницу мастеров');
                    break;
                case 'map':
                    openMapModal();
                    break;
                case 'calendar':
                    alert('Переход на календарь');
                    break;
                case 'finance':
                    alert('Переход на финансы');
                    break;
                case 'docs':
                    alert('Переход на документы');
                    break;
                case 'inventory':
                    alert('Переход на инвентарь');
                    break;
                case 'new_order':
                    alert('Создание нового заказа с ИИ-помощником');
                    break;
            }
        }

        function handleOrdersClick() {
            console.log('Orders button clicked');
            alert('Переход на страницу заявок');
        }

        function handleNotifications() {
            console.log('Notifications clicked');
            alert('Открытие уведомлений');
        }

        function handleNavClick(item) {
            console.log('Nav item clicked:', item);
            
            // Update active state
            document.querySelectorAll('.nav-item').forEach(navItem => {
                navItem.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // Add navigation logic here
            switch(item) {
                case 'home':
                    console.log('Переход на главную');
                    break;
                case 'calendar':
                    console.log('Переход на календарь');
                    break;
                case 'inventory':
                    console.log('Переход на инвентарь');
                    break;
                case 'docs':
                    console.log('Переход на документы');
                    break;
                case 'menu':
                    console.log('Открытие меню');
                    break;
            }
        }

        // Map Modal Functions
        let map = null;

        function openMapModal() {
            const modal = document.getElementById('mapModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Initialize Yandex Map
            if (!map) {
                ymaps.ready(function() {
                    map = new ymaps.Map('map', {
                        center: [36.5, 32.0], // Antalya coordinates
                        zoom: 12,
                        controls: ['zoomControl', 'searchControl']
                    });
                });
            }
        }

        function closeMapModal() {
            const modal = document.getElementById('mapModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Admin Profile Functions
        function openProfileEditModal() {
            const modal = document.getElementById('profileEditModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Load saved profile data
            loadProfileData();
        }

        function closeProfileEditModal() {
            const modal = document.getElementById('profileEditModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function openAdminMainModal() {
            const modal = document.getElementById('adminMainModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeAdminMainModal() {
            const modal = document.getElementById('adminMainModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleEditProfile() {
            console.log('Edit profile clicked');
            // Enable form editing
            const inputs = document.querySelectorAll('.form-input');
            inputs.forEach(input => {
                input.removeAttribute('readonly');
                input.focus();
            });
        }

        function saveProfile() {
            // Get form data
            const profileData = {
                name: document.getElementById('adminName').value,
                contact: document.getElementById('adminContact').value,
                position: document.getElementById('adminPosition').value,
                avatar: document.getElementById('avatarPreview').querySelector('img')?.src || null
            };
            
            // Save to localStorage
            localStorage.setItem('adminProfile', JSON.stringify(profileData));
            
            // Update header avatar if image exists
            if (profileData.avatar) {
                const headerAvatar = document.querySelector('.avatar');
                if (headerAvatar) {
                    headerAvatar.innerHTML = `<img src="${profileData.avatar}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                }
            }
            
            // Close profile edit modal
            closeProfileEditModal();
            
            // Open main admin modal
            openAdminMainModal();
        }

        function loadProfileData() {
            const savedData = localStorage.getItem('adminProfile');
            if (savedData) {
                const profileData = JSON.parse(savedData);
                document.getElementById('adminName').value = profileData.name || '';
                document.getElementById('adminContact').value = profileData.contact || '';
                document.getElementById('adminPosition').value = profileData.position || '';
                
                if (profileData.avatar) {
                    const avatarPreview = document.getElementById('avatarPreview');
                    avatarPreview.innerHTML = `<img src="${profileData.avatar}" alt="Avatar">`;
                }
            }
        }

        // Avatar upload handler
        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const avatarPreview = document.getElementById('avatarPreview');
                    avatarPreview.innerHTML = `<img src="${e.target.result}" alt="Avatar">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Avatar click handler in header
        function handleAvatarClick() {
            openProfileEditModal();
        }
    </script>
</body>
</html>
