<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceHub Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFFFFF 50%, #FFFFFF 100%);
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Header - All vw units */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5vw;
            padding-top: 4vw;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 0.5vw 2.5vw rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 7vw;
            font-weight: 700;
            color: #1E3A8A;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 3vw;
        }

        .notification-bell {
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .notification-bell:hover {
            transform: scale(1.1);
        }

        .notification-bell i {
            font-size: 6vw;
            color: #6B7280;
        }

        .notification-badge {
            position: absolute;
            top: -1.5vw;
            right: -1.5vw;
            background: #EF4444;
            color: white;
            width: 3.5vw;
            height: 3.5vw;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2vw;
            font-weight: 600;
            border: 0.4vw solid white;
        }

        .avatar {
            width: 11vw;
            height: 11vw;
            border-radius: 50%;
            background: linear-gradient(135deg, #E5E7EB 0%, #9CA3AF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar i {
            color: #9CA3AF;
            font-size: 3.85vw;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2vw;
            padding-bottom: 120px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Grid Layout with 12-Cell Structure (3x4) */
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 3vw;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Tile styles - No hover for main tiles */
        .tile {
            background: white;
            border-radius: 2vw;
            box-shadow: 0 1.5vw 3vw rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover only for small tiles (finance, docs, inventory) */
        .tile-finance:hover,
        .tile-docs:hover,
        .tile-inventory:hover {
            transform: translateY(-1vw);
            box-shadow: 0 2vw 4vw rgba(0, 0, 0, 0.2);
        }

        .tile-finance:active,
        .tile-docs:active,
        .tile-inventory:active {
            transform: translateY(-0.5vw);
            box-shadow: 0 1vw 2.5vw rgba(0, 0, 0, 0.15);
        }

        /* Fixed: Заявки занимает 2 квадратика в ширину */

        .tile img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        /* 12-Cell Grid Positioning - No hover for main tiles */
        .tile-masters {
            grid-column: 1;
            grid-row: 1 / 2.2;
            aspect-ratio: 1;
        }

        .tile-map {
            grid-column: 2 / 4;
            grid-row: 1 / 2.2;
            aspect-ratio: 2/1;
        }

        .tile-orders {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            aspect-ratio: 2/1;
        }

        .tile-calendar {
            grid-column: 3;
            grid-row: 2.2 / 3.2;
            aspect-ratio: 1;
        }

        .tile-finance {
            grid-column: 1;
            grid-row: 3.2 / 4.2;
            aspect-ratio: 1;
        }

        .tile-docs {
            grid-column: 2;
            grid-row: 3.2 / 4.2;
            aspect-ratio: 1;
        }

        .tile-inventory {
            grid-column: 3;
            grid-row: 3.2 / 4.2;
            aspect-ratio: 1;
        }

        .tile-new-order {
            grid-column: 1 / 4;
            grid-row: 4.2 / 5;
            aspect-ratio: 3/1;
        }

        /* Orders Button - All vw units */
        .orders-button {
            background: white;
            border-radius: 2vw;
            box-shadow: 0 1.5vw 3vw rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 2vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .orders-button:hover {
            transform: translateY(-1vw);
            box-shadow: 0 2vw 4vw rgba(0, 0, 0, 0.2);
        }

        .orders-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1.5vw;
            gap: 2vw;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 6vw;
            font-weight: 900;
            margin-bottom: 1vw;
        }

        .stat-today {
            color: #10B981;
        }

        .stat-tomorrow {
            color: #F59E0B;
        }

        .stat-label {
            font-size: 3.5vw;
            color: #6B7280;
            font-weight: 600;
        }

        .orders-text {
            text-align: center;
            color: #000000;
            font-size: 4.5vw;
            font-weight: 800;
            line-height: 1.3;
        }

        /* Bottom Navigation - All vw units */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -0.5vw 2.5vw rgba(0, 0, 0, 0.1);
            padding: 3vw 0;
            z-index: 1000;
        }

        .nav-items {
            display: flex;
            justify-content: space-around;
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vw;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 1vw;
            border-radius: 1.5vw;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .nav-item.active {
            color: #3B82F6;
        }

        .nav-icon {
            font-size: 6.5vw;
        }

        .nav-label {
            font-size: 3.5vw;
            font-weight: 500;
        }

        /* Responsive Media Queries */
        @media (max-width: 480px) {
            .header {
                padding: 2vw;
                padding-top: 3vw;
            }

            .header-title {
                font-size: 6vw;
            }

            .tiles-grid {
                gap: 3vw;
            }

            .main-content {
                padding: 1.5vw;
                padding-bottom: 100px;
            }

            .stat-number {
                font-size: 6vw;
                font-weight: 800;
            }

            .stat-label {
                font-size: 3.5vw;
                font-weight: 600;
            }

            .orders-text {
                font-size: 3.8vw;
                font-weight: 600;
                color: #6B7280;
            }

            .notification-bell i {
                font-size: 5.5vw;
            }

            .notification-badge {
                width: 3vw;
                height: 3vw;
                font-size: 1.8vw;
                top: -1.2vw;
                right: -1.2vw;
            }

            .avatar {
                width: 10vw;
                height: 10vw;
            }

            .avatar i {
                font-size: 3vw;
            }

            .nav-icon {
                font-size: 6vw;
            }

            .nav-label {
                font-size: 3.5vw;
            }
        }

        @media (max-width: 375px) {
            .header-title {
                font-size: 4vw;
            }

            .stat-number {
                font-size: 3vw;
            }

            .nav-icon {
                font-size: 3vw;
            }

            .nav-label {
                font-size: 1.8vw;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-title">ServiceHub</div>
        <div class="header-right">
            <div class="notification-bell" onclick="handleNotifications()">
                <i class="fas fa-bell"></i>
                <div class="notification-badge">3</div>
            </div>
            <div class="avatar">
                <i class="fas fa-user"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Tiles Grid - 3x4 Structure -->
        <div class="tiles-grid">
            <!-- Row 1: Masters (1,1) + Map (2-4,1) -->
            <div class="tile tile-masters" onclick="handleTileClick('masters')">
                <img src="masters_btn.png" alt="Мастера">
            </div>
            <div class="tile tile-map" onclick="handleTileClick('map')">
                <img src="map_btn.png" alt="Карта">
            </div>
            
            <!-- Row 2: Orders (1-3,2) + Calendar (3,2) -->
            <div class="orders-button tile-orders" onclick="handleOrdersClick()">
                <div class="orders-stats">
                    <div class="stat-item">
                        <div class="stat-number stat-today">12</div>
                        <div class="stat-label">Сегодня</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number stat-tomorrow">5</div>
                        <div class="stat-label">Завтра</div>
                    </div>
                </div>
                <div class="orders-text">
                    Заявки
                </div>
            </div>
            <div class="tile tile-calendar" onclick="handleTileClick('calendar')">
                <img src="calendar_btn.png" alt="Календарь">
            </div>
            
            <!-- Row 3: Finance (1,3) + Docs (2,3) + Inventory (3,3) -->
            <div class="tile tile-finance" onclick="handleTileClick('finance')">
                <img src="finance_btn.png" alt="Финансы">
            </div>
            <div class="tile tile-docs" onclick="handleTileClick('docs')">
                <img src="docs_btn.png" alt="Документация">
            </div>
            <div class="tile tile-inventory" onclick="handleTileClick('inventory')">
                <img src="inventory_btn.png" alt="Инвентарь">
            </div>
            
            <!-- Row 4: New Order (1-4,4) -->
            <div class="tile tile-new-order" onclick="handleTileClick('new_order')">
                <img src="new_order_btn.png" alt="Новый заказ">
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-items">
            <div class="nav-item active" onclick="handleNavClick('home')">
                <i class="fas fa-home nav-icon"></i>
                <span class="nav-label">Домой</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('calendar')">
                <i class="fas fa-calendar nav-icon"></i>
                <span class="nav-label">Календарь</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('inventory')">
                <i class="fas fa-box nav-icon"></i>
                <span class="nav-label">Инвентарь</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('docs')">
                <i class="fas fa-file-alt nav-icon"></i>
                <span class="nav-label">Документы</span>
            </div>
            <div class="nav-item" onclick="handleNavClick('menu')">
                <i class="fas fa-bars nav-icon"></i>
                <span class="nav-label">Меню</span>
            </div>
        </div>
    </nav>

    <script>
        // Navigation handlers
        function handleTileClick(tile) {
            console.log('Tile clicked:', tile);
            switch(tile) {
                case 'masters':
                    alert('Переход на страницу мастеров');
                    break;
                case 'map':
                    alert('Переход на карту');
                    break;
                case 'calendar':
                    alert('Переход на календарь');
                    break;
                case 'finance':
                    alert('Переход на финансы');
                    break;
                case 'docs':
                    alert('Переход на документы');
                    break;
                case 'inventory':
                    alert('Переход на инвентарь');
                    break;
                case 'new_order':
                    alert('Создание нового заказа с ИИ-помощником');
                    break;
            }
        }

        function handleOrdersClick() {
            console.log('Orders button clicked');
            alert('Переход на страницу заявок');
        }

        function handleNotifications() {
            console.log('Notifications clicked');
            alert('Открытие уведомлений');
        }

        function handleNavClick(item) {
            console.log('Nav item clicked:', item);
            
            // Update active state
            document.querySelectorAll('.nav-item').forEach(navItem => {
                navItem.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // Add navigation logic here
            switch(item) {
                case 'home':
                    console.log('Переход на главную');
                    break;
                case 'calendar':
                    console.log('Переход на календарь');
                    break;
                case 'inventory':
                    console.log('Переход на инвентарь');
                    break;
                case 'docs':
                    console.log('Переход на документы');
                    break;
                case 'menu':
                    console.log('Открытие меню');
                    break;
            }
        }
    </script>
</body>
</html>
